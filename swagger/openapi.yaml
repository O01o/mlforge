openapi: 3.1.0

info:
  title: MLforge API
  version: 0.1.0
  description: |
    A lightweight, language-independent experiment tracking API.

    MLforge manages experiments, runs, parameters, metrics, and plots
    metadata for machine learning and other computational workloads.

servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: System
  - name: Experiments
  - name: Runs
  - name: MetricPlots

paths:
  /health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Check server health
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /:
    get:
      tags:
        - Experiments
      operationId: listExperiments
      summary: List experiments
      responses:
        "200":
          description: Experiment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentListResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

    post:
      tags:
        - Experiments
      operationId: createExperiment
      summary: Create an experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentRequest"
      responses:
        "201":
          description: Experiment created
        "409":
          description: Experiment name already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /{experimentId}:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"

    get:
      tags:
        - Experiments
        - Runs
      operationId: getExperiment
      summary: Get an experiment
      responses:
        "200":
          description: Experiment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentDetailsResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

    patch:
      tags:
        - Experiments
      operationId: updateExperiment
      summary: Update an experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentRequest"
      responses:
        "204":
          description: Experiment updated
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

    delete:
      tags:
        - Experiments
      operationId: deleteExperiment
      summary: Delete an experiment
      description: |
        Deletes the experiment and its associated runs.
      responses:
        "204":
          description: Experiment deleted
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /{experimentId}/{runId}:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
      - $ref: "#/components/parameters/RunId"

    get:
      tags:
        - Runs
      operationId: listRuns
      summary: List runs in an experiment
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDetailsResponse"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

    post:
      tags:
        - Runs
      operationId: createRun
      summary: Create and start a run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "201":
          description: Run created
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"
    
    delete:
      tags:
        - Runs
      operationId: deleteRun
      summary: Delete a run
      description: |
        Deletes the run and its associated parameters and metrics.
      responses:
        "204":
          description: Run deleted
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /{experimentId}/{runId}/finish:
    parameters:
      - $ref: "#/components/parameters/RunId"

    put:
      tags:
        - Runs
      operationId: finishRun
      summary: Mark a run as completed
      responses:
        "204":
          description: Run completed
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: Invalid run status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /{experimentId}/{runId}/fail:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
      - $ref: "#/components/parameters/RunId"

    put:
      tags:
        - Runs
      operationId: failRun
      summary: Mark a run as failed
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailRunRequest"
      responses:
        "204":
          description: Run marked as failed
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        "409":
          description: Invalid run status transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/ErrorResponse"

  /{experimentId}/{runId}/{metricId}:
    parameters:
      - $ref: "#/components/parameters/ExperimentId"
      - $ref: "#/components/parameters/RunId"
      - $ref: "#/components/parameters/MetricId"

    get:
      tags:
        - MetricPlots
      operationId: getMetric
      summary: Get metric metadata and its latest point
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricPlotRangeRequest"
      responses:
        "200":
          description: Metric details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricDetail"
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

    post:
      tags:
        - MetricPlots
      operationId: postMetric
      summary: Post metric plots
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricPlotsRequest"
      responses:
        "204":
          description: Metric updated
        "404":
          $ref: "#/components/responses/NotFoundResponse"
        default:
          $ref: "#/components/responses/ErrorResponse"

components:
  parameters:
    ExperimentId:
      name: experimentId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    MetricId:
      name: metricId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    ErrorResponse:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFoundResponse:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          enum:
            - ok
        version:
          type: string
          example: 0.1.0

    RunStatus:
      type: integer
      enum:
        - 0 # running
        - 1 # completed
        - 2 # failed

    Parameter:
      type: object
      additionalProperties: false
      required:
        - name
        - value
      properties:
        name:
          type: string
          maxLength: 128
        value:
          type: string
          maxLength: 128
    
    MetricPlot:
      type: object
      additionalProperties: false
      required:
        - step
        - value
      properties:
        step:
          type: integer
          format: int64
          minimum: 0
        value:
          type: number
          format: double
    
    Metric:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        plots:
          type: array
          items:
            $ref: "#/components/schemas/MetricPlot"
    
    RunSummary:
      type: object
      required:
        - id
        - experimentId
        - status
        - startedAt
        - endedAt
        - failureReason
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        experimentId:
          type: integer
          format: int64
          minimum: 1
        name:
          type:
            - string
            - "null"
          maxLength: 128
        status:
          $ref: "#/components/schemas/RunStatus"
        startedAt:
          type: string
          format: date-time
        endedAt:
          type:
            - string
            - "null"
          format: date-time
        failureReason:
          type:
            - string
            - "null"
          maxLength: 4096
    
    ExperimentSummary:
      type: object
      required:
        - experimentId
        - name
        - description
        - createdAt
      properties:
        experimentId:
          type: integer
          format: int64
          minimum: 1
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 4096
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
            - string
            - "null"
          format: date-time

    ExperimentRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        description:
          type: string
          maxLength: 4096

    ExperimentListResponse:
      type: object
      required:
        - experiments
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentSummary"
    
    ExperimentDetailsResponse:
      type: object
      required:
        - experimentId
        - name
        - description
        - createdAt
      properties:
        experimentSummary:
          $ref: "#/components/schemas/ExperimentSummary"
        runSummaries:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
    
    ParameterRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - value
      properties:
        name:
          type: string
          maxLength: 128
        value:
          type: string
          maxLength: 128
    
    MetricRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128

    RunRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
          maxLength: 4096
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/ParameterRequest"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/MetricRequest"
    
    RunDetailsResponse:
      type: object
      required:
        - runSummary
        - parameters
        - metrics
      properties:
        runSummary:
          $ref: "#/components/schemas/RunSummary"
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/Parameter"
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"

    FailRunRequest:
      type: object
      additionalProperties: false
      properties:
        failureReason:
          type: string
          maxLength: 4096
    
    MetricPlotRangeRequest:
      type: object
      additionalProperties: false
      properties:
        startStep:
          type: integer
          format: int64
          minimum: 0
          default: 0
        endStep:
          type: integer
          format: int64
          minimum: 1
          default: 1000

    MetricPlotsRequest:
      type: object
      additionalProperties: false
      required:
        - plots
      properties:
        plots:
          type: array
          items:
            $ref: "#/components/schemas/MetricPlot"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: The requested run was not found.
        details:
          type:
            - object
            - "null"
          additionalProperties: true